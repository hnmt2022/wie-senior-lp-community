<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信が完了しました｜Wie for Life</title>
<meta name="description" content="お問い合わせありがとうございました。内容を確認し、担当より折り返しご連絡いたします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EA;
    --surface:#FFFFFF;
    --navy:#1F3A5C;
    --navy-soft:#E7ECF1;
    --ink:#322C22;
    --ink-soft:#6B6152;
    --cta:#E8899B;
    --cta-ink:#1F3A5C;
    --line:#E6DFC9;
    --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    line-height:1.85;
    font-size:18px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:520px;
    width:100%;
    margin:24px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:48px 36px;
    text-align:center;
  }
  .check{
    width:72px;
    height:72px;
    margin:0 auto 24px;
    border-radius:50%;
    background:var(--navy-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    color:var(--navy);
  }
  h1{
    font-size:24px;
    color:var(--navy);
    margin:0 0 16px;
  }
  p{
    font-size:17px;
    color:var(--ink-soft);
    margin:0 0 32px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:16px 36px;
    border-radius:100px;
    font-weight:600;
    font-size:18px;
    text-decoration:none;
    background:var(--cta);
    color:var(--cta-ink);
    min-height:52px;
    transition:background .15s ease,color .15s ease;
  }
  .btn:hover{background:var(--navy);color:#fff;}
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>送信が完了しました</h1>
    <p>お問い合わせありがとうございました。<br>内容を確認し、担当より折り返しご連絡いたします。</p>
    <a class="btn" href="index.html">トップページに戻る</a>
  </div>
</body>
</html>
